# For release build - release that - Github action tag and deploy it on Google Cloud Storage
name: Release

on:
  push:
    branches:
      - master
  # Recovery path for a release that was tagged but never made it to PyPI
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to PyPI
        required: true

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          # Token is used to push on main branch
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v2.6.0
        with:
          semantic_version: 17.3.7
          extra_plugins: |
            @semantic-release/commit-analyzer@8.0.1
            @semantic-release/release-notes-generator@9.0.1
            @semantic-release/changelog@5.0.1
            @semantic-release/github@7.2.0
            @semantic-release/exec@5.0.0
            @semantic-release/git@9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Separate job so a failed upload can be retried with "Re-run failed jobs".
  # Releases created with GITHUB_TOKEN don't trigger other workflows, so this can't live in its own workflow.
  publish:
    needs: release
    if: ${{ !cancelled() && (needs.release.outputs.published == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write  # PyPI trusted publishing

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || needs.release.outputs.version }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build a binary wheel and a source tarball
        run: |
          python -m pip install build
          python -m build --sdist --wheel --outdir dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
