# For release build - release that - Github action tag and deploy it on Google Cloud Storage
name: Release

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          # Token is used to push on main branch
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v2.6.0
        with:
          semantic_version: 17.3.7
          extra_plugins: |
            @semantic-release/commit-analyzer@8.0.1
            @semantic-release/release-notes-generator@9.0.1
            @semantic-release/changelog@5.0.1
            @semantic-release/github@7.2.0
            @semantic-release/exec@5.0.0
            @semantic-release/git@9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Releases created with GITHUB_TOKEN don't trigger other workflows, so publish from here
      - name: Set up Python
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build a binary wheel and a source tarball
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          python -m pip install build
          python -m build --sdist --wheel --outdir dist/

      - name: Publish distribution to PyPI
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
