name: Test

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - python-version: '3.7'
            toxenv: py37
          - python-version: '3.8'
            toxenv: py38
          - python-version: '3.9'
            toxenv: py39
          - python-version: '3.10'
            toxenv: py310
          - python-version: '3.11'
            toxenv: py311
          - python-version: '3.12'
            toxenv: py312
          - python-version: '3.13'
            toxenv: py313
          - python-version: '3.14'
            toxenv: py314
          - python-version: '3.15'
            toxenv: py315
          - python-version: '3.9'
            toxenv: desc

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox tox-gh-actions

    - name: Test with tox
      env:
        TOXENV: ${{ matrix.toxenv }}
      run: tox -v
